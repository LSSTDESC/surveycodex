name: "PanSTARRS"
description: "Panoramic Survey Telescope and Rapid Response System 1 (Pan-STARRS1, PS1) wide-field survey done with the 1.8m PS1 telescope at Haleakala Observatory, Hawaii, and the Gigapixel Camera #1 (GPC1)"
pixel_scale: 0.258
gain: 0.97
mirror_diameter: 1.8
obscuration: 0.32078172
zeropoint_airmass: 1.2
